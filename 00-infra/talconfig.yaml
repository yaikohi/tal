clusterName: yaya
talosVersion: v1.12.2
kubernetesVersion: v1.35.0
endpoint: "https://192.168.20.11:6443" # The VIP or LoadBalancer IP

cniConfig:
  name: none

patches:
  - |-
    machine:
      features:
        kubePrism:
          enabled: true
          port: 7445
  - |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true

nodes:
  - hostname: c-01
    ipAddress: 192.168.20.11
    controlPlane: true
    installDisk: /dev/sda
    machineSpec:
      mode: metal
      secureboot: false
      vmid: 6011
      mac: "BC:25:11:00:00:11"

  - hostname: w-01
    ipAddress: 192.168.20.21
    controlPlane: false
    installDisk: /dev/sda
    machineSpec:
      vmid: 6021
      mac: "BC:25:11:00:00:21"

  - hostname: w-02
    ipAddress: 192.168.20.22
    controlPlane: false
    installDisk: /dev/sda
    machineSpec:
      vmid: 6022
      mac: "BC:25:11:00:00:22"

  # Bare-metal minipc (Ryzen 6900, 512GB NVMe) — dedicated gameserver node.
  # No machineSpec.vmid => main.tf must skip it (see vmid-filter fix) so tofu
  # never tries to create a Proxmox VM. Applied/upgraded with talosctl only.
  - hostname: game-01
    ipAddress: 192.168.20.31
    controlPlane: false
    installDisk: /dev/nvme0n1
    machineSpec:
      mode: metal
      secureboot: false
      mac: "58:47:CA:70:68:3A"   # eno1 — set UniFi DHCP reservation -> .31
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/amd-ucode
            - siderolabs/util-linux-tools
            - siderolabs/nfs-utils
    patches:
      - |-
        machine:
          install:
            wipe: true   # bare-metal disk still holds Proxmox LVM/ZFS sigs
          nodeLabels:
            ykhi.xyz/gameserver: "true"
          nodeTaints:
            dedicated: "gameserver:NoSchedule"

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/qemu-guest-agent
          - siderolabs/util-linux-tools
          - siderolabs/nfs-utils

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/qemu-guest-agent
          - siderolabs/util-linux-tools
          - siderolabs/nfs-utils
