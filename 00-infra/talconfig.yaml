clusterName: yaya
talosVersion: v1.12.2
kubernetesVersion: v1.35.0
endpoint: "https://192.168.20.11:6443" # The VIP or LoadBalancer IP

cniConfig:
  name: none

patches:
  - |-
    machine:
      features:
        kubePrism:
          enabled: true
          port: 7445
  - |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true

nodes:
  - hostname: c-01
    ipAddress: 192.168.20.11
    controlPlane: true
    installDisk: /dev/sda
    machineSpec:
      mode: metal
      secureboot: false
      vmid: 6011
      mac: "BC:25:11:00:00:11"

  # The passed-through Alder Lake-P iGPU has no VBIOS table in the guest, so i915
  # cannot know there is no panel and probes the eDP/DDI encoder anyway. That
  # probe times out after ~2s on a good boot and sometimes never terminates,
  # hanging the node at ~2.7s of kernel time with qemu spinning at 195% CPU.
  # This VM has a virtual VGA for its console and uses the iGPU only for media
  # transcode, so the display engine is pure liability: turn it off. GuC/HuC and
  # the render engine are unaffected, which is all Jellyfin's VAAPI needs.
  # A node-level schematic REPLACES worker.schematic, so the extensions below
  # are restated rather than inherited.
  - hostname: w-01
    ipAddress: 192.168.20.21
    controlPlane: false
    installDisk: /dev/sda
    machineSpec:
      vmid: 6021
      mac: "BC:25:11:00:00:21"
    schematic:
      customization:
        extraKernelArgs:
          - i915.disable_display=1
        systemExtensions:
          officialExtensions:
            - siderolabs/intel-ucode
            - siderolabs/i915
            - siderolabs/qemu-guest-agent
            - siderolabs/util-linux-tools
            - siderolabs/nfs-utils

  - hostname: w-02
    ipAddress: 192.168.20.22
    controlPlane: false
    installDisk: /dev/sda
    machineSpec:
      vmid: 6022
      mac: "BC:25:11:00:00:22"

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/qemu-guest-agent
          - siderolabs/util-linux-tools
          - siderolabs/nfs-utils

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/qemu-guest-agent
          - siderolabs/util-linux-tools
          - siderolabs/nfs-utils
